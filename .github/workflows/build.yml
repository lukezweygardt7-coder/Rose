name: Build Rose Companion

'on':
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Forge 1.12.2 / Java 8
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "4.10.3"

      - name: Verify project files and toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          test -f build.gradle
          test -f settings.gradle
          test -f src/main/resources/mcmod.info
          test -f src/main/resources/assets/rosecompanion/textures/entity/rose.png
          test -f src/main/java/com/rosecompanion/RoseCompanion.java

      - name: Prepare ForgeGradle CI workspace and build
        shell: bash
        run: gradle clean setupCIWorkspace build --no-daemon --stacktrace

      - name: Verify output JAR contents
        shell: bash
        run: |
          set -euo pipefail
          JAR_FILE="build/libs/RoseCompanion-1.0.0.jar"
          test -s "$JAR_FILE"
          jar tf "$JAR_FILE" > jar-contents.txt
          grep -q '^mcmod.info$' jar-contents.txt
          grep -q '^com/rosecompanion/RoseCompanion.class$' jar-contents.txt
          grep -q '^com/rosecompanion/entity/EntityRoseDog.class$' jar-contents.txt
          grep -q '^assets/rosecompanion/textures/entity/rose.png$' jar-contents.txt

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: RoseCompanion-Forge-1.12.2
          path: build/libs/RoseCompanion-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
